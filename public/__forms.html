<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form detection</title>
  </head>
  <body>
    <form name="minnesnowii-gform_1" method="POST" action="/thank-you/" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="minnesnowii-gform_1" />
      <input type="hidden" name="subject" data-remove-prefix value="New website message" />
      <input name="bot-field" />
      <label>Name <input type="text" name="name" /></label>
      <label>Email <input type="email" name="email" /></label>
      <label>Message <textarea name="message"></textarea></label>
    </form>
    <form name="minnesnowii-gform_2" method="POST" action="/thank-you/" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="minnesnowii-gform_2" />
      <input type="hidden" name="subject" data-remove-prefix value="New event booking" />
      <input name="bot-field" />
      <label>Name <input type="text" name="name" /></label>
      <label>Email <input type="email" name="email" /></label>
      <label>Phone <input type="tel" name="phone" /></label>
      <label>Date of event <input type="text" name="event-date" /></label>
      <label>Event type</label>
      <select name="event-type">
        <option value="Birthday">Birthday</option>
        <option value="Wedding">Wedding</option>
        <option value="Grad Party">Grad Party</option>
        <option value="Company Picnic">Company Picnic</option>
        <option value="Other">Other</option>
      </select>
      <label>Street address <input type="text" name="street-address" /></label>
      <label>City <input type="text" name="city" /></label>
      <label>State <input type="text" name="state" /></label>
      <label>ZIP code <input type="text" name="zip-code" /></label>
      <label>Country <input type="hidden" name="country" value="United States" /></label>
      <label>Setting <input type="radio" name="setting" value="Residential" /></label>
      <label>Setting <input type="radio" name="setting" value="Commercial" /></label>
      <label>Approximate number of cups needed <input type="text" name="cups" /></label>
      <label>Duration of event in hours <input type="text" name="duration-hours" /></label>
    </form>
    <form name="minnesnowii-gform_3" method="POST" action="/thank-you/" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="minnesnowii-gform_3" />
      <input type="hidden" name="subject" data-remove-prefix value="New contest entry" />
      <input name="bot-field" />
      <label>First name <input type="text" name="first-name" /></label>
      <label>Last name <input type="text" name="last-name" /></label>
      <label>Email <input type="email" name="email" /></label>
      <label>Date of birth <input type="text" name="date-of-birth" /></label>
      <label>Street address <input type="text" name="street-address" /></label>
      <label>City <input type="text" name="city" /></label>
      <label>State</label>
      <select name="state"><option value=""></option></select>
      <label>ZIP code <input type="text" name="zip-code" /></label>
      <label>Country <input type="hidden" name="country" value="United States" /></label>
      <label>Phone <input type="tel" name="phone" /></label>
      <label>Mailing list <input type="checkbox" name="mailing-list" value="Yes" /></label>
    </form>
    <form name="minnesnowii-gform_4" method="POST" action="/thank-you/" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="minnesnowii-gform_4" />
      <input type="hidden" name="subject" data-remove-prefix value="New newsletter signup" />
      <input name="bot-field" />
      <label>Email <input type="email" name="email" /></label>
      <label>Mailing list <input type="checkbox" name="mailing-list" value="Yes" /></label>
    </form>
  </body>
</html>
